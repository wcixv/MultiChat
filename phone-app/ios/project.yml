# XcodeGen project spec. On a Mac: `brew install xcodegen && xcodegen generate`, then open MultiChat.xcodeproj.
# (The GitHub Actions workflow in ../.github does this for you in the cloud.)
name: MultiChat
options:
  bundleIdPrefix: win.multichat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MultiChat:
    type: application
    platform: iOS
    sources:
      - MultiChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: win.multichat.giveaway
        DEVELOPMENT_TEAM: ""                       # put your 10-character Apple Team ID here (or pick it in Xcode)
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MultiChat/MultiChat.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MultiChat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
